[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "language-immersion-tools"
dynamic = ["version"]
description = "Active immersion in foreign-language PDFs and videos, with one-click Anki card mining."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.7.0",
    "PyMuPDF>=1.24.0",
    "platformdirs>=4.0.0",
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "googletrans==4.0.2",
    "httpx>=0.27.2,<1.0",
]

[project.optional-dependencies]
offline = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "sacremoses>=0.0.53",
]
media = [
    "openai-whisper",
    "ffmpeg-python",
    "yt-dlp",
    "matplotlib>=3.8.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pyflakes>=3.0.0",
    "matplotlib>=3.8.0",
    "beautifulsoup4>=4.12.0",
    "spacy>=3.7.0",
]

[project.scripts]
immersion = "immersion_app.app:main"

[project.gui-scripts]
immersion-gui = "immersion_app.app:main"

[tool.setuptools.dynamic]
version = { attr = "immersion_app.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immersion_app = ["gui/fonts/*"]
